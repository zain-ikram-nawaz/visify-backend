name: Deploy Visify Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Starting Visify Backend deployment..."

            cd /var/www/visify-backend
            git pull origin main

            cd ~/n8n-automation

            sudo docker compose up -d --build visify-backend

            echo "Checking backend container..."
            sudo docker compose ps visify-backend

            echo "Visify Backend deployment completed!"